version: "3.8"

services:
  db:
    image: postgres:15
    env_file:
      - .env.prod
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - evoluta_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  web:
    image: odoo:19
    depends_on:
      - db
    env_file:
      - .env.prod
    ports:
      - "127.0.0.1:8069:8069"
      - "127.0.0.1:8072:8072"
    volumes:
      - ./addons/oca:/mnt/oca:ro
      - ./addons/evoluta:/mnt/evoluta:ro
      - ./config/runtime/odoo.prod.conf:/etc/odoo/odoo.conf:ro
      - evoluta_prod_odoo:/var/lib/odoo
    command: ["odoo", "-c", "/etc/odoo/odoo.conf"]
    restart: unless-stopped
    networks:
      - backend

volumes:
  evoluta_prod_pgdata:
  evoluta_prod_odoo:

networks:
  backend:
    driver: bridge
